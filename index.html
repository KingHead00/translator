<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="logo.png">
 <title>FR ↔ EN Translator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 2rem; width: 100%; max-width: 680px; }
  h1 { font-size: 20px; font-weight: 600; color: #111; margin-bottom: 1.25rem; }
  .lang-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .badge { font-size: 13px; font-weight: 500; padding: 6px 18px; border-radius: 8px; border: 1px solid #ddd; background: #f9f9f7; color: #111; display: flex; align-items: center; gap: 6px; min-width: 120px; justify-content: center; }
  .swap { background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; padding: 6px 14px; color: #555; font-size: 18px; transition: background 0.15s; }
  .swap:hover { background: #f0f0ec; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel { border: 1px solid #e5e5e0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; min-height: 180px; }
  .plabel { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
  textarea { flex: 1; min-height: 130px; background: transparent; border: none; outline: none; resize: none; font-size: 15px; line-height: 1.6; color: #111; font-family: inherit; width: 100%; }
  .out { flex: 1; min-height: 130px; font-size: 15px; line-height: 1.6; color: #111; white-space: pre-wrap; word-break: break-word; }
  .out.ph { color: #aaa; font-style: italic; }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .go-btn { flex: 1; padding: 10px; font-size: 15px; font-weight: 500; background: #f0f0ec; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; color: #111; transition: background 0.15s; }
  .go-btn:hover:not(:disabled) { background: #e5e5e0; }
  .go-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .copy-btn { background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; padding: 8px 14px; font-size: 13px; color: #555; transition: background 0.15s; }
  .copy-btn:hover { background: #f0f0ec; }
  .status { font-size: 12px; color: #888; margin-top: 6px; min-height: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
  .chip { font-size: 12px; padding: 4px 12px; border-radius: 99px; border: 1px solid #ddd; cursor: pointer; color: #666; background: #fff; transition: background 0.15s; }
  .chip:hover { background: #f0f0ec; color: #111; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 480px) { .panels { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="card">
  <h1>🌐 Translator</h1>

  <div class="lang-row">
    <div class="badge"><span id="sf">🇬🇧</span> <span id="sl">English</span></div>
    <button class="swap" onclick="swapDir()" title="Swap languages">⇄</button>
    <div class="badge"><span id="tf">🇫🇷</span> <span id="tl">French</span></div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="plabel" id="splabel">English</div>
      <textarea id="inp" placeholder="Type or paste text…" oninput="onInput()"></textarea>
    </div>
    <div class="panel">
      <div class="plabel" id="tplabel">French</div>
      <div class="out ph" id="out">Translation will appear here…</div>
    </div>
  </div>

  <div class="actions">
    <button class="go-btn" id="gobtn" onclick="doTranslate()" disabled>Translate</button>
    <button class="copy-btn" id="copybtn" onclick="doCopy()" style="display:none">Copy</button>
  </div>
  <div class="status" id="status"></div>

  <div class="chips">
    <span style="font-size:12px;color:#aaa">Try:</span>
    <button class="chip" onclick="eg('Hello, how are you?','en')">Hello, how are you?</button>
    <button class="chip" onclick="eg('Where is the train station?','en')">Where is the train station?</button>
    <button class="chip" onclick="eg('I love Paris in the springtime.','en')">I love Paris in springtime.</button>
    <button class="chip" onclick="eg(&quot;Bonjour, je m'appelle Marie.&quot;,'fr')">Bonjour, je m'appelle Marie.</button>
    <button class="chip" onclick="eg(&quot;C'est magnifique!&quot;,'fr')">C'est magnifique!</button>
  </div>
</div>

<script>
  let dir = 'en-fr';

  function setUI() {
    const f2e = dir === 'fr-en';
    document.getElementById('sf').textContent = f2e ? '🇫🇷' : '🇬🇧';
    document.getElementById('sl').textContent = f2e ? 'French' : 'English';
    document.getElementById('tf').textContent = f2e ? '🇬🇧' : '🇫🇷';
    document.getElementById('tl').textContent = f2e ? 'English' : 'French';
    document.getElementById('splabel').textContent = f2e ? 'French' : 'English';
    document.getElementById('tplabel').textContent = f2e ? 'English' : 'French';
  }

  function swapDir() {
    const prev = document.getElementById('out').classList.contains('ph') ? '' : document.getElementById('out').textContent.trim();
    dir = dir === 'en-fr' ? 'fr-en' : 'en-fr';
    setUI();
    resetOut();
    document.getElementById('status').textContent = '';
    document.getElementById('inp').value = prev || '';
    onInput();
  }

  function resetOut() {
    const o = document.getElementById('out');
    o.textContent = 'Translation will appear here…';
    o.classList.add('ph');
    document.getElementById('copybtn').style.display = 'none';
  }

  function onInput() {
    document.getElementById('gobtn').disabled = !document.getElementById('inp').value.trim();
  }

  function eg(text, lang) {
    if (lang === 'fr' && dir !== 'fr-en') { dir = 'fr-en'; setUI(); }
    if (lang === 'en' && dir !== 'en-fr') { dir = 'en-fr'; setUI(); }
    document.getElementById('inp').value = text;
    resetOut();
    document.getElementById('status').textContent = '';
    onInput();
  }

  async function doTranslate() {
    const text = document.getElementById('inp').value.trim();
    if (!text) return;
    const btn = document.getElementById('gobtn');
    const st = document.getElementById('status');
    btn.disabled = true;
    btn.textContent = 'Translating…';
    st.textContent = '';
    resetOut();

    const pair = dir === 'en-fr' ? 'en|fr' : 'fr|en';
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${pair}`);
      const data = await res.json();
      if (data.responseStatus === 200 && data.responseData?.translatedText) {
        const o = document.getElementById('out');
        o.textContent = data.responseData.translatedText;
        o.classList.remove('ph');
        document.getElementById('copybtn').style.display = 'inline-block';
        st.textContent = '✓ Done';
      } else {
        st.textContent = 'Translation failed — try again.';
      }
    } catch (e) {
      st.textContent = 'Network error — check your internet connection.';
    }

    btn.disabled = false;
    btn.textContent = 'Translate';
  }

  function doCopy() {
    const text = document.getElementById('out').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const b = document.getElementById('copybtn');
      b.textContent = 'Copied!';
      setTimeout(() => { b.textContent = 'Copy'; }, 1500);
    });
  }
</script>
</body>
</html>
